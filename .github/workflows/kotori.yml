name: kotori

on:
  push:
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: pwd
      - run: ls -al
      - run: npm ci
      - run: npm run build

      - name: 打 CRX + ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npx --no-install crx3 dist \
            -o "easynewtab-$TAG.crx" \
            -z "easynewtab-$TAG.zip" \
            --forceDateTime 1

      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            easynewtab-*.crx easynewtab-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
