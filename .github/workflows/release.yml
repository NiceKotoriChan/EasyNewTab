name: Build Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 从 Git tag 获取版本号，例如 v1.2.3 → 1.2.3
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 修改 manifest.json 中的 version
      - name: Update manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const path = "manifest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));

          manifest.version = process.env.VERSION;

          fs.writeFileSync(
            path,
            JSON.stringify(manifest, null, 2) + "\n"
          );
          EOF

      # 构建扩展
      - name: Build
        run: pnpm build

      # 恢复私钥
      - name: Restore extension private key
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          if [ -z "$EXTENSION_PRIVATE_KEY" ]; then
            echo "EXTENSION_PRIVATE_KEY is not configured"
            exit 1
          fi

          printf '%s\n' "$EXTENSION_PRIVATE_KEY" > extension.pem
          chmod 600 extension.pem

      # 安装 Chromium
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      # 打包 CRX
      - name: Pack CRX
        run: |
          mkdir -p release

          chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$PWD/dist" \
            --pack-extension-key="$PWD/extension.pem"

          mv dist.crx "release/EasyNewTab-${{ steps.version.outputs.version }}.crx"

      # 计算 SHA256
      - name: Generate checksum
        run: |
          cd release
          sha256sum *.crx > SHA256SUMS

      # 删除私钥
      - name: Remove private key
        if: always()
        run: |
          rm -f extension.pem

      # 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyNewTab ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.crx
            release/SHA256SUMS
