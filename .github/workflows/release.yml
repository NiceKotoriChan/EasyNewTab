name: Build Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建扩展
      - name: Build
        run: npm run build

      # 恢复私钥
      - name: Restore extension private key
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          if [ -z "$EXTENSION_PRIVATE_KEY" ]; then
            echo "EXTENSION_PRIVATE_KEY is not configured"
            exit 1
          fi

          printf '%s\n' "$EXTENSION_PRIVATE_KEY" > extension.pem
          chmod 600 extension.pem

      # 打包 CRX
      - name: Pack CRX
        run: |
          npx --no-install crx3 dist \
            -p extension.pem \
            -o "EasyNewTab-$GITHUB_REF_NAME-chrome.crx" \
            -z "EasyNewTab-$GITHUB_REF_NAME-chrome.zip" \
            --forceDateTime 1

      # 删除私钥
      - name: Remove private key
        if: always()
        run: |
          rm -f extension.pem

      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyNewTab ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            EasyNewTab-${{ github.ref_name }}-chrome.crx
            EasyNewTab-${{ github.ref_name }}-chrome.zip
